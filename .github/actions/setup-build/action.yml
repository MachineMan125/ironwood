name: Set up Ironwood build
description: Free disk space, add swap, install host packages and prepare the Firefox source tree.

inputs:
  version:
    description: Firefox version to build (e.g. 140.5.0esr)
    required: true

runs:
  using: composite
  steps:
    # Hosted runners start with ~14 GB free; a Firefox LTO build needs ~40 GB.
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                    /usr/share/swift /usr/local/.ghcup || true
        sudo docker image prune -af >/dev/null 2>&1 || true
        df -h /

    # The libxul LTO link is memory hungry; 16 GB RAM + 16 GB swap is safe.
    - name: Add swap
      shell: bash
      run: |
        sudo swapoff -a || true
        sudo fallocate -l 16G /swapfile-build
        sudo chmod 600 /swapfile-build
        sudo mkswap /swapfile-build
        sudo swapon /swapfile-build
        free -h

    - name: Install host packages
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          python3 python3-pip curl xz-utils patch unzip m4 \
          xvfb dbus-x11 libgtk-3-0t64 libasound2t64 libx11-xcb1 \
          libdbus-glib-1-2 libpci3 libxtst6

    # Toolchains that mach bootstraps (clang, rust, sysroot...) ~3 GB.
    - name: Cache ~/.mozbuild toolchains
      uses: actions/cache@v4
      with:
        path: ~/.mozbuild
        key: mozbuild-${{ runner.os }}-${{ inputs.version }}
        restore-keys: mozbuild-${{ runner.os }}-

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Prepare Firefox source
      shell: bash
      run: |
        chmod +x scripts/*.sh
        scripts/prepare-source.sh "${{ inputs.version }}" src
