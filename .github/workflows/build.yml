# =====================================================================
#  Ironwood: build a Gecko browser for Devuan 6 (i5-7300U / HD 620)
#
#  Run it from the Actions tab -> "Build Ironwood" -> "Run workflow".
#  With PGO on, this is two build jobs:
#    1. pgo-profile : instrumented build, run it under Xvfb, save profile
#    2. build       : final LTO build using that profile, then a .deb,
#                     test-installed on Debian trixie (Devuan 6's base)
#  An optional third job publishes the .deb as a GitHub Release.
#  Each job stays within GitHub's 6-hour limit for hosted runners.
#
#  Each build is for one CPU target (skylake, ivybridge or westmere):
#  the package only runs on that CPU generation or newer. The target is
#  part of the package version, e.g. 153.7.0~esr-12+ivybridge.
#
#  It also runs by itself twice a day. A scheduled run checks, for every
#  CPU target in AUTO_TARGETS, whether Mozilla's current ESR version has
#  already been published here (release v<version> carrying
#  SHA256SUMS-<target>.txt). Targets that have it are skipped; the others
#  get the full PGO build and are added to that release. GitHub only runs
#  schedules from the default branch, and pauses them after 60 days
#  without commits.
# =====================================================================
name: Build Ironwood
run-name: ${{ github.event_name == 'schedule' && 'Scheduled check for a new Firefox ESR' || format('Ironwood {0} / {1}{2}', inputs.firefox_version, inputs.cpu_target, inputs.pgo && ' (PGO)' || '') }}

on:
  schedule:
    # 04:17 and 16:17 UTC, every day.
    - cron: '17 4,16 * * *'
  workflow_dispatch:
    inputs:
      firefox_version:
        description: 'Firefox version ("latest-esr", "latest", or exact e.g. 140.5.0esr)'
        default: latest-esr
        required: true
      cpu_target:
        description: 'CPU generation to build for: skylake (i5-7300U laptop), ivybridge (HP Z220), westmere (Latitude E6410). The package will not start on an older CPU.'
        type: choice
        default: skylake
        options:
          - skylake
          - ivybridge
          - westmere
      pgo:
        description: Use profile-guided optimization (two jobs, ~2x build time)
        type: boolean
        default: true
      publish_release:
        description: Publish the .deb as a GitHub Release
        type: boolean
        default: false

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

# "shell: bash" (rather than the implicit default) turns on pipefail.
defaults:
  run:
    shell: bash

env:
  APP_NAME: ironwood
  APP_DISPLAY: Ironwood
  # CPU targets that scheduled runs build, space separated.
  AUTO_TARGETS: skylake ivybridge
  MOZCONFIG: ${{ github.workspace }}/src/mozconfig
  MOZBUILD_STATE_PATH: /home/runner/.mozbuild
  MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: pip
  SCCACHE_GHA_ENABLED: "true"
  # Keep the sccache server alive through long link/package phases,
  # so its end-of-job stats step doesn't fail.
  SCCACHE_IDLE_TIMEOUT: "0"

concurrency:
  group: ironwood-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      # 'true' / 'false' strings. A scheduled run has no inputs, so the
      # other jobs read these instead of the inputs.
      needed: ${{ steps.v.outputs.needed }}
      pgo: ${{ steps.v.outputs.pgo }}
      publish: ${{ steps.v.outputs.publish }}
      # CPU targets to build: a JSON list for the job matrices, and the
      # same names separated by spaces for the release job.
      targets: ${{ steps.v.outputs.targets }}
      target_names: ${{ steps.v.outputs.target_names }}
    steps:
      - id: v
        name: Resolve Firefox version and decide what to build
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.firefox_version }}
          IN_TARGET: ${{ inputs.cpu_target }}
          IN_PGO: ${{ inputs.pgo }}
          IN_PUBLISH: ${{ inputs.publish_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = schedule ]; then
            # Scheduled runs: newest ESR, with PGO, published as a release.
            IN=latest-esr; PGO=true; PUBLISH=true; WANTED="$AUTO_TARGETS"
          else
            IN="$IN_VERSION"; PGO="$IN_PGO"; PUBLISH="$IN_PUBLISH"; WANTED="${IN_TARGET:-skylake}"
          fi
          [ "$PGO" = true ] || PGO=false
          [ "$PUBLISH" = true ] || PUBLISH=false
          for t in $WANTED; do
            case "$t" in skylake|ivybridge|westmere) ;; *) echo "::error::Unknown CPU target '$t'"; exit 1 ;; esac
          done

          case "$IN" in
            latest-esr) KEY=FIREFOX_ESR ;;
            latest)     KEY=LATEST_FIREFOX_VERSION ;;
            *)          KEY="" ;;
          esac
          if [ -n "$KEY" ]; then
            VER=$(curl -fsSL --retry 5 https://product-details.mozilla.org/1.0/firefox_versions.json \
                  | KEY="$KEY" python3 -c "import os,sys,json; print(json.load(sys.stdin)[os.environ['KEY']])")
          else
            VER="$IN"
          fi
          # The version ends up in a URL, a file name and the Debian version.
          if ! [[ "$VER" =~ ^[0-9]+(\.[0-9]+)+(esr|b[0-9]+)?$ ]]; then
            echo "::error::'$VER' does not look like a Firefox version (e.g. 140.5.0esr, 145.0.1, 146.0b5)"
            exit 1
          fi

          # A run started by hand always builds its target. A scheduled run
          # builds only the targets that release v<version> does not have yet
          # (a target is done once the release carries SHA256SUMS-<target>.txt).
          TODO="$WANTED"
          if [ "$EVENT" = schedule ]; then
            if assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v${VER}" --jq '.assets[].name' 2>/tmp/gh-err); then
              :
            elif grep -q -e 'Not Found' -e 'HTTP 404' /tmp/gh-err; then
              assets=""
            else
              echo "::error::Could not read release v${VER}: $(cat /tmp/gh-err)"; exit 1
            fi
            TODO=""
            for t in $WANTED; do
              if printf '%s\n' "$assets" | grep -qx "SHA256SUMS-${t}.txt"; then
                echo "$t: Firefox $VER already published"
              else
                echo "$t: Firefox $VER to build"; TODO="$TODO $t"
              fi
            done
          fi
          TODO=$(echo $TODO)
          if [ -n "$TODO" ]; then NEEDED=true; else NEEDED=false; fi
          TARGETS_JSON=$(python3 -c "import json,sys; print(json.dumps(sys.argv[1].split()))" "$TODO")

          if [ "$NEEDED" = true ]; then
            msg="Building Firefox $VER for: $TODO (PGO: $PGO, publish release: $PUBLISH)"
          else
            msg="Firefox $VER is already published for: $WANTED; nothing to do"
          fi
          echo "$msg"
          echo "### $msg" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "version=$VER"
            echo "needed=$NEEDED"
            echo "pgo=$PGO"
            echo "publish=$PUBLISH"
            echo "targets=$TARGETS_JSON"
            echo "target_names=$TODO"
          } >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------
  pgo-profile:
    if: ${{ needs.resolve.outputs.needed == 'true' && needs.resolve.outputs.pgo == 'true' }}
    needs: resolve
    name: pgo-profile (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    runs-on: ubuntu-24.04
    # Below the 360-minute hard limit, so the steps after a slow build
    # (stats, uploads) still get to run.
    # The step timeouts further down are only there to stop a hung step;
    # they are set several times above the durations seen so far.
    timeout-minutes: 350
    env:
      PGO_STAGE: generate
      CPU_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build
        with:
          version: ${{ needs.resolve.outputs.version }}

      # Configure on its own first: a Rust / clang mismatch then fails here,
      # after a few minutes, instead of at the profiling run or the link.
      - name: Configure and check toolchains
        working-directory: src
        timeout-minutes: 30
        run: |
          ./mach --no-interactive configure
          ../scripts/check-toolchain.sh

      - name: Build instrumented browser
        working-directory: src
        timeout-minutes: 280
        run: ./mach --no-interactive build

      - name: Package instrumented build
        working-directory: src
        timeout-minutes: 60
        run: ./mach package

      # Mozilla's own profiling run: loads a set of real pages and
      # writes merged.profdata (code profile) and en-US.log (jar order).
      #
      # Ubuntu 24.04 runners block unprivileged user namespaces through
      # AppArmor, which Firefox's sandbox needs; the browser then crashes
      # at startup. Lift that limit on the runner, and also switch the
      # sandboxes off for this profiling run only (the final build is
      # not affected).
      - name: Allow Firefox sandbox on the runner
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Collect profile under Xvfb
        working-directory: src
        timeout-minutes: 90
        env:
          JARLOG_FILE: en-US.log
          # Without this, profileserver.py leaves the raw *.profraw files
          # unmerged and never writes merged.profdata.
          LLVM_PROFDATA: ${{ env.MOZBUILD_STATE_PATH }}/clang/bin/llvm-profdata
          MOZ_DISABLE_CONTENT_SANDBOX: "1"
          MOZ_DISABLE_GMP_SANDBOX: "1"
          MOZ_DISABLE_RDD_SANDBOX: "1"
          MOZ_DISABLE_SOCKET_PROCESS_SANDBOX: "1"
          MOZ_DISABLE_UTILITY_SANDBOX: "1"
        run: |
          [ -x "$LLVM_PROFDATA" ] || { echo "::error::llvm-profdata not found at $LLVM_PROFDATA"; exit 1; }
          xvfb-run -a -s "-screen 0 2560x1440x24" \
            ./mach python build/pgo/profileserver.py || {
              BIN="obj-release/dist/bin/${APP_NAME}"
              echo "::group::Missing libraries"
              LD_LIBRARY_PATH=obj-release/dist/bin ldd "$BIN" obj-release/dist/bin/libxul.so | grep "not found" || echo "none"
              echo "::endgroup::"
              echo "::group::Startup backtrace (gdb)"
              mkdir -p /tmp/diag-profile
              timeout 180 xvfb-run -a -s "-screen 0 2560x1440x24" \
                gdb -q -batch -nx \
                  -ex "set pagination off" \
                  -ex "set follow-fork-mode parent" \
                  -ex "handle SIGSYS SIGPIPE SIGUSR1 SIGUSR2 nostop noprint" \
                  -ex run \
                  -ex "info registers rip" \
                  -ex "x/3i \$pc" \
                  -ex "bt 40" \
                  -ex "thread apply all bt 8" \
                  --args "$BIN" -no-remote -profile /tmp/diag-profile about:blank \
                2>&1 | grep -vE "^\[(New|Thread|Detaching|Inferior)" | tail -n 250 || true
              echo "::endgroup::"
              exit 1
            }
          mkdir -p ../pgo-out
          # -print -quit instead of "| head -n1": with pipefail, head closing
          # the pipe early could fail the step.
          PROF=$(find . -name merged.profdata -newer mozconfig -print -quit)
          JAR=$(find . -name en-US.log -newer mozconfig -print -quit)
          if [ -z "$PROF" ] || [ -z "$JAR" ]; then
            echo "::error::Profile files not found (merged.profdata: ${PROF:-missing}, en-US.log: ${JAR:-missing})"
            echo "Raw profiles in $(pwd): $(find . -maxdepth 1 -name '*.profraw' | wc -l)"
            exit 1
          fi
          [ -s "$PROF" ] && [ -s "$JAR" ] || { echo "::error::Profile files are empty"; exit 1; }
          cp "$PROF" ../pgo-out/merged.profdata
          cp "$JAR"  ../pgo-out/en-US.log
          ls -lh ../pgo-out

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - uses: actions/upload-artifact@v6
        with:
          name: pgo-profile-${{ matrix.target }}
          path: pgo-out/
          retention-days: 7
          overwrite: true
          if-no-files-found: error

  # -------------------------------------------------------------------
  build:
    needs: [resolve, pgo-profile]
    # Runs after the profiling job whatever its result: with PGO off it was
    # skipped, and when one CPU target's profiling failed the other targets
    # should still build. A target whose profile is missing fails at
    # "Fetch PGO profile".
    # !cancelled() (not always()) so cancelling the run really stops it.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.needed == 'true' }}
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PGO_STAGE: ${{ needs.resolve.outputs.pgo == 'true' && 'use' || 'none' }}
      CPU_TARGET: ${{ matrix.target }}
      FFVER: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build
        with:
          version: ${{ needs.resolve.outputs.version }}

      - name: Fetch PGO profile
        if: ${{ needs.resolve.outputs.pgo == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: pgo-profile-${{ matrix.target }}
          path: src/

      # Configure on its own first: a Rust / clang mismatch then fails here,
      # after a few minutes, instead of at the profiling run or the link.
      - name: Configure and check toolchains
        working-directory: src
        timeout-minutes: 30
        run: |
          ./mach --no-interactive configure
          ../scripts/check-toolchain.sh

      - name: Build optimized browser (LTO${{ needs.resolve.outputs.pgo == 'true' && ' + PGO' || '' }})
        working-directory: src
        timeout-minutes: 300
        run: ./mach --no-interactive build

      - name: Package
        working-directory: src
        timeout-minutes: 60
        run: ./mach package

      - name: Build .deb
        run: scripts/make-deb.sh src "$FFVER" out

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

      - name: Disk usage
        if: always()
        run: df -h / /mnt 2>/dev/null || df -h /

      # Uploaded before the install test, so the package is still
      # available for inspection if the test is what fails.
      - uses: actions/upload-artifact@v6
        with:
          name: ironwood-${{ needs.resolve.outputs.version }}-${{ matrix.target }}-deb
          path: |
            out/*.deb
            out/SHA256SUMS
          retention-days: 30
          if-no-files-found: error

      # Devuan 6 "excalibur" is based on Debian trixie. Installing there
      # checks the hand-written Depends line, and running the binary
      # checks that it starts and that no shared library is missing.
      - name: Test-install on Debian trixie
        timeout-minutes: 30
        run: |
          docker run --rm -v "$PWD/out:/deb:ro" -e APP_NAME debian:trixie \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends /deb/*.deb
              "$APP_NAME" --version
              lib="/usr/lib/$APP_NAME"
              missing=$(LD_LIBRARY_PATH="$lib" ldd "$lib/$APP_NAME" "$lib/libxul.so" | grep "not found" | sort -u || true)
              if [ -n "$missing" ]; then
                echo "Unresolved shared libraries:"; echo "$missing"; exit 1
              fi
              echo "Install test passed"
            '

  # -------------------------------------------------------------------
  release:
    needs: [resolve, build]
    # Publishes whatever built, even if another CPU target failed. A target
    # that failed has no SHA256SUMS-<target>.txt in the release, so the
    # next scheduled run builds it again.
    if: ${{ !cancelled() && needs.resolve.outputs.publish == 'true' && needs.resolve.outputs.needed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          FFVER: ${{ needs.resolve.outputs.version }}
          TARGETS: ${{ needs.resolve.outputs.target_names }}
          PGO: ${{ needs.resolve.outputs.pgo }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TAG="v${FFVER}"
          mkdir -p dl out
          names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[].name')
          built=""
          for t in $TARGETS; do
            name="ironwood-${FFVER}-${t}-deb"
            if ! printf '%s\n' "$names" | grep -qx "$name"; then
              echo "::warning::No package for $t (its build failed); the next scheduled run will retry it"
              continue
            fi
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" -n "$name" -D "dl/$t"
            (cd "dl/$t" && sha256sum -c SHA256SUMS)
            cp "dl/$t"/*.deb out/
            cp "dl/$t/SHA256SUMS" "out/SHA256SUMS-$t.txt"
            built="$built $t"
          done
          [ -n "$built" ] || { echo "::error::No CPU target built successfully; nothing to publish"; exit 1; }
          ls -lh out
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            {
              echo "Built from Firefox ${FFVER} source. PGO: ${PGO}."
              echo
              echo "There is one package per CPU generation; the name is in the file name. A package does not start on an older CPU than it was built for:"
              echo
              echo "- skylake: Core i5-7300U laptop (Skylake and newer)"
              echo "- ivybridge: HP Z220 (Ivy Bridge and newer)"
              echo "- westmere: Latitude E6410 (Westmere and newer)"
              echo
              echo "Install with: sudo apt install ./ironwood_*<cpu>_amd64.deb"
            } > notes.md
            gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Ironwood ${FFVER}" --notes-file notes.md
          fi
          echo "### Published $TAG for:$built" >> "$GITHUB_STEP_SUMMARY"
